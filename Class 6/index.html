<!DOCTYPE html>
<html>
    <head>
        <title>Assets embedding</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <ul>
        <h3><li>To add image</li></h3>
        <img src="assets/prakhardoneria.jpg" alt="Prakhar Doneria" height="200" width="200">

        <br><br>

        <h3><li>To add video</li></h3>
        <video src="assets/video.mp4" controls width="300" height="200">Video tag not supported</video>

        <br><br>

        <h3><li>To add audio</li></h3>
        <audio src="assets/music.mp3" muted autoplay controls>Music tag not supported by browser</audio>

        <br><br>
        </ul>
    </body>
</html>
