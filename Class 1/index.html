<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prakhar Doneria - Profile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        h1 {
            color: #f8bbd0;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .highlight {
            color: #ffab91;
            font-weight: bold;
        }

        .bio {
            line-height: 1.6;
            margin-top: 20px;
            opacity: 0.9;
        }

        .social-links {
            margin-top: 30px;
        }

        .social-links a {
            color: #bbdefb;
            margin: 0 10px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: #64b5f6;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhuYtjmkJo4yhs9PJG5dJf7TAPKcvk5oC_5g&s" 
             alt="Prakhar Doneria" 
             class="profile-pic">
        <h1>Hello, I'm <span class="highlight">Prakhar Doneria</span></h1>
        <p class="bio">
            Software developer passionate about creating elegant solutions to complex problems. 
            Currently focused on web development and user experience design.
        </p>
        <div class="social-links">
            <a href="https://in.linkedin.com/in/prakhar-doneria-646090228" target="_blank">LinkedIn</a>
            <a href="https://github.com/PrakharDoneria" target="_blank">GitHub</a>
            <a href="https://x.com/prakhardoneria2" target="_blank">Twitter</a>
        </div>
    </div>
</body>
</html>
