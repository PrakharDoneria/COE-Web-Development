<body>
        <form action="/submit" method="post">
          <label for="name">Name: </label>
          <input type="text" name="name" id="name">
      
          <br><br>
      
          <label for="email">Email: </label>
          <input type="email" name="email" id="email">
      
          <br><br>
      
          <label for="year">Choose your year:</label>
          <br>
          <input type="radio" id="year1" name="year" value="1"> 1st Year
          <input type="radio" id="year2" name="year" value="2"> 2nd Year
          <input type="radio" id="year3" name="year" value="3"> 3rd Year
          <input type="radio" id="year4" name="year" value="4"> 4th Year
      
          <br><br>
      
          <label for="subjects">Choose your subjects:</label>
          <br>
          <input type="checkbox" id="PPS" name="subjects" value="PPS"> PPS
          <input type="checkbox" id="electronics" name="subjects" value="Electronics"> Electronics
          <input type="checkbox" id="electrical" name="subjects" value="Electrical"> Electrical
          <input type="checkbox" id="maths1" name="subjects" value="Maths M1"> Maths M1
          <input type="checkbox" id="maths2" name="subjects" value="Maths M2"> Maths M2
      
          <br><br>


          <label for="rate">Rate us:</label>
          <select name="rate" id="rate-dropdown">
                <option value="1">Poor</option>
                <option value="2">Considerable</option>
                <option value="3">Good</option>
                <option value="4">Great</option>
                <option value="5">Outstanding</option>
          </select>
              
          <br><br>

          <button type="submit">Submit</button>
        </form>
      </body>
