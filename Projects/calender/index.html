<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Calendar</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <table class="calendar">
        <thead>
            <tr>
                <th>Sun</th>
                <th>Mon</th>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
                <th>Sat</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="non-month">30</td>
                <td class="non-month">31</td>
                <td class="month-date">1</td>
                <td class="month-date">2</td>
                <td class="month-date">3</td>
                <td class="month-date">4</td>
                <td class="month-date">5</td>
            </tr>
            <tr>
                <td class="month-date">6</td>
                <td class="month-date">7</td>
                <td class="month-date">8</td>
                <td class="month-date">9</td>
                <td class="month-date">10</td>
                <td class="month-date">11</td>
                <td class="month-date">12</td>
            </tr>
            <tr>
                <td class="month-date">13</td>
                <td class="month-date">14</td>
                <td class="month-date">15</td>
                <td class="month-date">16</td>
                <td class="month-date">17</td>
                <td class="month-date">18</td>
                <td class="month-date">19</td>
            </tr>
            <tr>
                <td class="month-date">20</td>
                <td class="month-date">21</td>
                <td class="month-date">22</td>
                <td class="month-date bold-date">23 <span class="material-icons" style="vertical-align: middle; font-size: 18px;">calendar_today</span></td>
                <td class="month-date">24</td>
                <td class="month-date">25</td>
                <td class="month-date">26</td>
            </tr>
            <tr>
                <td class="month-date">27</td>
                <td class="month-date">28</td>
                <td class="month-date">29</td>
                <td class="month-date">30</td>
                <td class="non-month">1</td>
                <td class="non-month">2</td>
                <td class="non-month">3</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
